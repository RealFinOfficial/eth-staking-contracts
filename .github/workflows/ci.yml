name: CI

on:
  push:
  pull_request:

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      # No MAINNET_RPC_URL is configured here on purpose: no repository secret is
      # needed to run this job. With the variable unset the fork suite falls back to
      # public archive endpoints and skips itself only if none of them can serve the
      # pinned block. Anything that fails after a fork is established fails the job —
      # the suite never converts a real defect into a skip. Set MAINNET_RPC_URL to a
      # dedicated archive node to make the fork tests mandatory.
      - name: Test
        run: npx hardhat test
